name: Course availability monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a check or send a test notification
        type: choice
        options: [check, test_alert]
        default: check
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: course-monitor
  cancel-in-progress: false

jobs:
  check:
    # The schedule stays off until the owner explicitly sets MONITOR_ENABLED=true.
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify monitor code on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: npm test
      - name: Check availability
        run: node src/check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          SESSION_INITIAL: ${{ secrets.SESSION_INITIAL }}
          MONITOR_CONFIG: ${{ secrets.MONITOR_CONFIG }}
          MONITOR_MODE: ${{ inputs.mode || 'check' }}
